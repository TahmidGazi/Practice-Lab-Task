<!DOCTYPE html>
<head>
    <meta name="author" content="Tahmid Gazi">
    <meta name="description" content="University Online Admission Form">
    <title>University Admission Form</title>
</head>
<body>

    <header>
        <h1>AIUB Online Admission Form</h1>
    </header>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            
            <fieldset>
                <legend>Personal Info</legend>
                
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" maxlength="50" required><br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required><br><br>

                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label><br><br>

                <label>Interests:</label>
                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label>
                <input type="checkbox" id="programming" name="interests" value="programming">
                <label for="programming">Programming</label>
                <input type="checkbox" id="music" name="interests" value="music">
                <label for="music">Music</label>
            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Info</legend>

                <label for="dept">Preferred Department:</label>
                <select id="dept" name="department" required>
                    <option value="">--Select Department--</option>
                    <option value="CSE">Computer Science & Engineering</option>
                    <option value="EEE">Electrical & Electronic Engineering</option>
                    <option value="BBA">Business Administration</option>
                </select><br><br>

                <label for="document">Upload Transcript/Resume:</label>
                <input type="file" id="document" name="document" required>
            </fieldset>

            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>
    </main>

</body>
</html>
